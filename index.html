<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="학생 프로젝트 Git 활동 대시보드">
  <meta property="og:title" content="Git 활동 대시보드">
  <meta property="og:description" content="게임 프로젝트의 주차별 Git 활동을 한눈에">
  <meta property="og:image" content="og.png">
  <title>Git 활동 대시보드</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="logo">G</div>
    <div class="brand"><strong>Git 활동 대시보드</strong><span id="courseTitle">게임 프로젝트</span></div>
    <div class="sync"><i></i><span id="updatedAt">데이터 불러오는 중</span></div>
  </header>

  <section class="notice">
    <div class="notion-icon">N</div>
    <div><strong>Git 기록은 작업의 증거입니다.</strong><p>이번 주 목표, 결과물 링크, 문제 해결 과정과 다음 계획은 반드시 Notion에 직접 작성하세요.</p></div>
    <a id="notionLink" href="#" target="_blank" rel="noopener">Notion 작성하기 ↗</a>
  </section>

  <main class="workspace">
    <aside class="sidebar">
      <div class="aside-title"><strong>수강생</strong><span id="studentCount">0명</span></div>
      <label class="search"><span>⌕</span><input id="searchInput" placeholder="이름, 학번, 팀 검색" autocomplete="off"></label>
      <div class="filters" aria-label="활동 상태 필터">
        <button class="active" data-filter="all">전체</button>
        <button data-filter="active">정상</button>
        <button data-filter="watch">확인 필요</button>
        <button data-filter="inactive">미활동</button>
      </div>
      <div class="student-list" id="studentList"></div>
    </aside>

    <section class="dashboard" id="dashboard" aria-live="polite">
      <div class="loading">학생 활동 데이터를 불러오고 있습니다.</div>
    </section>
  </main>
  <footer>자동 수집된 Git 활동 자료이며, 프로젝트 평가는 Notion 기록과 결과물을 함께 확인합니다.</footer>
</body>
</html>
