name: Collect Git activity and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "10 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect student commits
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
        run: node scripts/collect-github.mjs
      - name: Save refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/students.json
          git diff --cached --quiet || git commit -m "chore: update student Git activity"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
  
